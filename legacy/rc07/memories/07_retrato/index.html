<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retrato ASCII Programado</title>
<style>
  :root{--bg:#0b0810;--panel:#120d18ea;--line:#ffffff14;--text:#f8eff4;--muted:#cebfc8;--accent:#f2becd;--accent2:#e8d7ae}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:radial-gradient(circle at top,#24172a 0,#130d1b 38%,#09070c 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  body.embed .shell{min-height:100dvh;padding:0}
  body.embed .meta,body.embed .controlbar{display:none}
  body.embed .stage-wrap{border-radius:0;border:none;box-shadow:none;background:transparent;padding:0}
  .shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:12px}
  .meta,.controlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .label{font-size:.84rem;letter-spacing:.14em;text-transform:uppercase;color:#dfced6}
  .label strong{color:#fff5fb}
  .controlbar{padding:2px 2px 0}
  .left-controls,.right-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{appearance:none;border:none;background:#ffffff0a;border:1px solid #ffffff14;color:var(--text);border-radius:999px;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer;transition:.25s transform,.25s background}
  button:hover{transform:translateY(-1px);background:#ffffff10}
  button.primary{background:linear-gradient(135deg,#f0b8c6,#e8d8ae);color:#24151a;border:none}
  .status{font-size:.9rem;color:#d8cad1}
  .stage-wrap{position:relative;display:grid;place-items:center;padding:10px;border-radius:28px;background:linear-gradient(180deg,#18111fb8,#120d19f0);border:1px solid #ffffff10;box-shadow:0 30px 90px #0008;overflow:hidden}
  .stage-wrap:before{content:"";position:absolute;inset:-18%;background:radial-gradient(circle at center,#efbcc61f 0,#0000 58%);pointer-events:none}
  canvas{width:min(100%,840px);height:auto;aspect-ratio:900/1180;display:block;border-radius:22px;background:linear-gradient(180deg,#16101a,#09070c);box-shadow:0 24px 70px #0007}
  .hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#0f0b14cc;border:1px solid #ffffff10;color:#f2e8ed;font-size:.85rem;letter-spacing:.04em;backdrop-filter:blur(10px)}
  .timeline{height:8px;min-width:min(320px,68vw);background:#ffffff10;border-radius:999px;overflow:hidden}
  .timeline span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#efb9c7,#ead8b0,#f2b2cb);border-radius:inherit;transition:width .08s linear}
  .small{font-size:.85rem;color:#d2c2ca}
  @media (max-width:700px){.shell{padding:10px}.stage-wrap{padding:0;border-radius:22px}.meta,.controlbar{gap:8px}.timeline{min-width:180px;flex:1}button{padding:10px 13px}.hint{left:12px;right:12px;transform:none;bottom:12px;text-align:center;font-size:.8rem}}
</style>
<style>
body.embed .shell{height:100dvh;min-height:100dvh;grid-template-rows:minmax(0,1fr);gap:0;padding:0}body.embed .stage-wrap{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}body.embed canvas{height:100%;width:auto;max-width:100%;object-fit:contain;box-shadow:none;border-radius:0}body.embed .hint{display:none}
</style></head>
<body>
<div class="shell">
  <div class="meta">
    <div class="label"><strong>RETRATO ASCII</strong> · UNA ESCENA ROMÁNTICA PROGRAMADA</div>
    <div class="small" id="phaseLabel">Preparando la escena…</div>
  </div>

      <button id="pause">Pausar</button>
      <button id="finalBtn">Ir al final</button>
    </div>
    <div class="right-controls">
      <div class="timeline" aria-hidden="true"><span id="timelineFill"></span></div>
      <div class="status" id="timeLabel">00:00 / 00:12</div>
    </div>
  </div>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const embed = qs.get('embed') === '1' || window.parent !== window;
  if (embed) document.body.classList.add('embed');
  const autoplay = qs.get('autoplay') !== '0';

  const canvas = document.getElementById('asciiCanvas');
  const ctx = canvas.getContext('2d');
  const img = document.getElementById('sourceImage');
  const phaseLabel = document.getElementById('phaseLabel');
  const timeLabel = document.getElementById('timeLabel');
  const timelineFill = document.getElementById('timelineFill');
  const hint = document.getElementById('hint');
  const replayBtn = document.getElementById('replay');
  const pauseBtn = document.getElementById('pause');
  const finalBtn = document.getElementById('finalBtn');
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d', {willReadFrequently:true});

  const W = canvas.width, H = canvas.height;
  const CHARS = ' .,:;i1tfLCG08@';
  const DURATION = 12;
  const particles = [];
  const hearts = [];
  let ready = false, start = 0, pausedAt = 0, paused = !autoplay;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function mix(a,b,t){return a+(b-a)*t;}
  function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function easeOut(t){return 1-Math.pow(1-t,3);}

  function fitCover(sw, sh, dw, dh){
    const sr = sw/sh, dr = dw/dh;
    let sx=0, sy=0, sW=sw, sH=sh;
    if (sr > dr){ sW = sh*dr; sx = (sw-sW)/2; }
    else { sH = sw/dr; sy = (sh-sH)/2; }
    return {sx, sy, sW, sH};
  }

  function heartBurst(x,y, count=10){
    for(let i=0;i<count;i++){
      hearts.push({x,y,vx:(Math.random()-.5)*2.2,vy:-1.6-Math.random()*2.3,life:0,max:1.6+Math.random()*0.8,size:10+Math.random()*13,rot:(Math.random()-.5)*1.2,hue:i%2?0:18});
    }
  }

  function ambientSparkles(count=36){
    particles.length=0;
    for(let i=0;i<count;i++) particles.push({x:Math.random()*W,y:Math.random()*H*.72,r:1+Math.random()*2.4,tw:Math.random()*Math.PI*2,spd:.7+Math.random()*1.4});
  }

  function drawHeart(x,y,s,alpha,rot,hue=0){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/24,s/24); ctx.globalAlpha=alpha;
    const grad=ctx.createLinearGradient(-14,-12,16,16);
    grad.addColorStop(0, `hsla(${345+hue}, 88%, 84%, 1)`);
    grad.addColorStop(1, `hsla(${28+hue*0.4}, 86%, 76%, 1)`);
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(0,10); ctx.bezierCurveTo(-18,-6,-22,-26,-2,-28); ctx.bezierCurveTo(10,-28,12,-18,14,-12); ctx.bezierCurveTo(18,-18,24,-20,28,-14); ctx.bezierCurveTo(36,-2,24,10,0,30); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function bg(t){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1d1322'); g.addColorStop(.42,'#130d19'); g.addColorStop(1,'#09070c');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const rg=ctx.createRadialGradient(W*.52,H*.30,40,W*.52,H*.32,380); rg.addColorStop(0,'rgba(252,205,218,0.16)'); rg.addColorStop(1,'rgba(252,205,218,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.9;
    for(const p of particles){
      const a=.18+.5*(.5+.5*Math.sin(t*p.spd+p.tw));
      ctx.fillStyle=`rgba(255,240,245,${a})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function frame(){
    const x=46, y=56, w=W-92, h=H-112;
    const rg=ctx.createLinearGradient(x,y,x+w,y+h); rg.addColorStop(0,'#2a1a25'); rg.addColorStop(1,'#161019');
    roundRect(x,y,w,h,28,rg,'rgba(255,255,255,.10)',2);
    const inner=ctx.createLinearGradient(x+18,y+18,x+w-18,y+h-18); inner.addColorStop(0,'rgba(240,184,198,.06)'); inner.addColorStop(1,'rgba(232,216,174,.03)');
    roundRect(x+16,y+16,w-32,h-32,22,inner,'rgba(255,255,255,.06)',1.2);
  }

  function roundRect(x,y,w,h,r,fill,stroke,line){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    if(fill){ctx.fillStyle=fill; ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=line||1; ctx.stroke();}
  }

  function renderAscii(t){
    const pad=78; const viewX=pad, viewY=pad, viewW=W-pad*2, viewH=H-pad*2;
    const cols = W < 700 ? 74 : 92;
    const cellW = viewW/cols; const cellH = cellW*1.36; const rows = Math.floor(viewH/cellH);
    off.width = cols; off.height = rows;
    const crop = fitCover(img.naturalWidth,img.naturalHeight, cols, rows);
    offCtx.clearRect(0,0,cols,rows);
    offCtx.drawImage(img, crop.sx,crop.sy,crop.sW,crop.sH, 0,0,cols,rows);
    const data=offCtx.getImageData(0,0,cols,rows).data;

    const revealBase = clamp((t-1.2)/6.1,0,1);
    const crisp = clamp((t-5.5)/2.6,0,1);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = `${Math.max(8,Math.floor(cellW*1.12))}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;

    for(let y=0;y<rows;y++){
      const rowReveal = clamp((revealBase*1.25) - (y/rows)*0.72, 0, 1);
      for(let x=0;x<cols;x++){
        const idx=(y*cols+x)*4;
        const r=data[idx], g=data[idx+1], b=data[idx+2], a=data[idx+3]/255;
        if(a < 0.08) continue;
        const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
        const noise=(Math.sin(x*12.9898+y*78.233)*43758.5453)%1;
        const local = clamp(rowReveal + noise*0.28, 0, 1);
        if(local < 0.24) continue;
        const sharpLum = mix(lum, Math.pow(lum,.88), crisp);
        const char = CHARS[Math.floor((1-sharpLum)*(CHARS.length-1))];
        const alpha = (0.35 + local*0.75) * (0.55 + crisp*0.45);
        const drawX=viewX+x*cellW+cellW*.5;
        const drawY=viewY+y*cellH+cellH*.53;
        const glow = crisp>0.2 && ((x+y)%19===0) ? .14*crisp : 0;
        if (glow>0){ ctx.shadowBlur=10; ctx.shadowColor=`rgba(${r},${g},${b},${0.24*crisp})`; } else { ctx.shadowBlur=0; }
        ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
        ctx.fillText(char, drawX, drawY);
      }
    }
    ctx.shadowBlur=0;

    const vign=ctx.createLinearGradient(0,0,0,H); vign.addColorStop(0,'rgba(8,7,11,.05)'); vign.addColorStop(.75,'rgba(8,7,11,0)'); vign.addColorStop(1,'rgba(8,7,11,.18)');
    ctx.fillStyle=vign; ctx.fillRect(0,0,W,H);
  }

  function overlays(t){
    const p = clamp((t-4.8)/4.2,0,1);
    if(p>0){
      ctx.save();
      ctx.globalAlpha=.16*p;
      const rg=ctx.createRadialGradient(W*.53,H*.54,18,W*.53,H*.54,190); rg.addColorStop(0,'rgba(255,230,238,1)'); rg.addColorStop(1,'rgba(255,230,238,0)');
      ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    const heartTime = clamp((t-7.0)/1.2,0,1);
    if(heartTime>0){
      const baseAlpha = .35*heartTime;
      drawHeart(W*.18,H*.18,14+Math.sin(t*2)*1.8,baseAlpha,.18);
      drawHeart(W*.81,H*.17,12+Math.sin(t*1.8+.6)*1.6,baseAlpha*0.8,-.3,10);
      drawHeart(W*.86,H*.26,9+Math.sin(t*2.2+1.2),baseAlpha*0.55,.26,-6);
    }
    for(let i=hearts.length-1;i>=0;i--){
      const h=hearts[i]; h.life += 1/60; h.x += h.vx; h.y += h.vy; h.rot += .02; const p=1-(h.life/h.max);
      if(p<=0){ hearts.splice(i,1); continue; }
      drawHeart(h.x,h.y,h.size*p, p*.9, h.rot, h.hue);
    }

    ctx.save();
    ctx.globalAlpha=.85; ctx.fillStyle='rgba(245,237,242,.92)';
    ctx.font='600 21px ui-sans-serif, system-ui'; ctx.textAlign='left';
    ctx.fillText('FIG. 07 · BESO + PERRITO · ASCII', 82, 50);
    ctx.globalAlpha=.72; ctx.font='500 16px ui-sans-serif, system-ui';
    ctx.fillText('Una fotografía convertida en una pequeña experiencia de código.', 82, H-34);
    ctx.restore();
  }

  function phaseText(t){
    if (t < 1.2) return 'Preparando la escena…';
    if (t < 4.2) return 'Aparecen las siluetas.';
    if (t < 7.0) return 'Los detalles del retrato se revelan.';
    if (t < 9.0) return 'El momento ya está completo.';
    return 'Final romántico · listo para repetir.';
  }

  function format(sec){ const m=Math.floor(sec/60); const s=Math.floor(sec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

  function draw(now){
    if(!ready){ requestAnimationFrame(draw); return; }
    if(!start) start = now;
    if(paused){ start += (now - pausedAt); pausedAt = now; }
    const t = clamp((now - start)/1000, 0, DURATION);
    bg(t); frame(); renderAscii(t); overlays(t);
    phaseLabel.textContent = phaseText(t);
    timeLabel.textContent = `${format(t)} / ${format(DURATION)}`;
    timelineFill.style.width = `${(t/DURATION)*100}%`;
    if (t >= 2.5) hint.style.opacity = '.95';
    if (t >= DURATION && !paused) { paused = true; pausedAt = now; pauseBtn.textContent = 'Reanudar'; }
    requestAnimationFrame(draw);
  }

  function replay(){ paused=false; start=0; pausedAt=performance.now(); pauseBtn.textContent='Pausar'; hearts.length=0; hint.style.opacity='.95'; }
  function togglePause(){ paused=!paused; pausedAt=performance.now(); pauseBtn.textContent = paused ? 'Reanudar' : 'Pausar'; }
  function goFinal(){ paused=false; start=performance.now() - (DURATION*1000); pausedAt=performance.now(); pauseBtn.textContent='Pausar'; }

  replayBtn.addEventListener('click', replay);
  pauseBtn.addEventListener('click', togglePause);
  finalBtn.addEventListener('click', goFinal);
  canvas.addEventListener('pointerdown', (ev)=>{
    const rect=canvas.getBoundingClientRect();
    const x=(ev.clientX-rect.left)*(W/rect.width); const y=(ev.clientY-rect.top)*(H/rect.height);
    heartBurst(x,y, 8 + Math.floor(Math.random()*5));
    hint.textContent = 'Qué bonito se ve este recuerdo en ASCII ♥';
  });

  ambientSparkles();
  img.addEventListener('load', ()=>{ ready=true; if (!autoplay){ paused=true; pauseBtn.textContent='Reanudar'; } requestAnimationFrame(draw); });
  if (img.complete && img.naturalWidth) img.dispatchEvent(new Event('load'));
})();
</script>
</body>
