<script>
(()=>{'use strict';
const W=720,H=850,TOTAL=10.6,TAU=Math.PI*2;

const layer=document.createElement('canvas');layer.width=W;layer.height=H;const g=layer.getContext('2d',{willReadFrequently:true});
const $=id=>document.getElementById(id);const state={t:0,playing:true,coarse:false,night:true,immersive:false,hold:0,finished:false};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const starSeed=Array.from({length:92},(_,i)=>({x:38+((i*97.37+16.8)%652),y:38+((i*193.71+79)%682),r:(i%7===0?1.5:.5),phase:i*2.13,color:i%4===0?'#ecd0a5':'#a29dac'}));
const wildFlowers=Array.from({length:22},(_,i)=>({x:28+((i*113+67)%660),y:684+((i*37+23)%103),scale:.53+(i%5)*.12,color:['#b68daa','#e5ab8b','#d5d0a7','#9b8cb5'][i%4]}));
function path(fn,fill,stroke=null,lw=1){g.beginPath();fn();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,color,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);g.fillStyle=color;g.fill();g.restore()}
function grad(x,y,r,stops){const c=g.createRadialGradient(x-r*.25,y-r*.32,r*.05,x,y,r);stops.forEach(([k,v])=>c.addColorStop(k,v));return c}
function shadowPath(fn,base,stroke,lw){g.save();g.shadowColor='#0009';g.shadowBlur=17;g.shadowOffsetY=11;path(fn,base,stroke,lw);g.restore()}
function furStroke(x1,y1,x2,y2,c='#f4e8de9a',w=.9){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function bezier(x1,y1,c1x,c1y,c2x,c2y,x2,y2,c,w){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.bezierCurveTo(c1x,c1y,c2x,c2y,x2,y2);g.stroke()}
function back(t){g.clearRect(0,0,W,H);const globe=g.createRadialGradient(360,460,32,360,460,475);globe.addColorStop(0,state.night?'#26202c':'#322320');globe.addColorStop(.57,state.night?'#15121b':'#1b1518');globe.addColorStop(1,'#07080c');g.fillStyle=globe;g.fillRect(0,0,W,H);
  const halo=g.createRadialGradient(355,485,10,355,465,360);halo.addColorStop(0,state.night?'#b997a016':'#d4a47820');halo.addColorStop(1,'#d3aa8800');g.fillStyle=halo;g.fillRect(0,0,W,H);
  const reveal=smooth(.1,1.9,t);for(let i=0;i<starSeed.length;i++){const s=starSeed[i];const b=clamp((Math.sin(t*.9+s.phase)*.35+.7)*reveal);g.globalAlpha=b;ellipse(s.x,s.y,s.r,s.r,s.color);if(i%11===0){g.strokeStyle=s.color;g.lineWidth=.6;g.beginPath();g.moveTo(s.x-4,s.y);g.lineTo(s.x+4,s.y);g.moveTo(s.x,s.y-4);g.lineTo(s.x,s.y+4);g.stroke()}}
  g.globalAlpha=1;const ground=smooth(.6,2.4,t);g.save();g.globalAlpha=ground;
  for(let i=0;i<120;i++){const xx=38+((i*141.3+29)%660),yy=748+((i*17.6)%92);bezier(xx,yy,xx-4,yy-5,xx+3,yy-16-(i%9),xx+((i%3)-1)*6,yy-24-(i%12),i%3===0?'#b49a63':'#526c54',.7+(i%3)*.5)}
  for(const f of wildFlowers){bezier(f.x,f.y+22,f.x-6,f.y+9,f.x+9,f.y-11,f.x,f.y-20,'#637359',1.1);for(let p=0;p<5;p++){const a=p*TAU/5;ellipse(f.x+Math.cos(a)*5*f.scale,f.y-22+Math.sin(a)*5*f.scale,3.7*f.scale,4.8*f.scale,f.color,a)}ellipse(f.x,f.y-22,2.2*f.scale,2.2*f.scale,'#dfbd76')}
  // surrounding winding greenery
  for(let i=0;i<16;i++){const xx=i<8?125+i*17:475+(i-8)*15,y=708+(i%4)*17;bezier(xx,y,xx+(i%2?23:-21),y-59,xx-24,y-99,xx+(i%2?-15:17),y-126,'#5f7550bb',1.3);ellipse(xx+(i%2?-10:13),y-79,12,5,'#627c59ad',(i%5-2)*.55)}g.restore();}
// Botanical sprites are rendered by Canvas once, then reused while swaying.
// The final image is STILL entirely resampled into colored ASCII characters.
const flowerAtlas=new Map();
function flowerSprite(r,tone){
  const key=r.toFixed(2)+'-'+tone;
  if(flowerAtlas.has(key))return flowerAtlas.get(key);
  const size=Math.ceil(r*3.6+12),spr=document.createElement('canvas');
  spr.width=spr.height=size;const c=spr.getContext('2d');
  const center=size/2,petals=7;
  c.save();c.translate(center,center);
  for(let j=0;j<petals;j++){
    const a=j*TAU/petals;
    const px=Math.cos(a)*r*.48,py=Math.sin(a)*r*.48;
    c.save();c.translate(px,py);c.rotate(a+Math.PI/2);
    const gr=c.createRadialGradient(-r*.10,-r*.44,r*.05,0,-r*.3,r*.95);
    gr.addColorStop(0,'#fff3d9');gr.addColorStop(.55,tone);gr.addColorStop(1,'#ad758cbd');
    c.fillStyle=gr;c.beginPath();c.ellipse(0,-r*.22,r*.30,r*.60,0,0,TAU);c.fill();
    c.strokeStyle='#fff0d6a8';c.lineWidth=.8;c.beginPath();
    c.moveTo(0,-r*.5);c.bezierCurveTo(1,-r*.36,-1,-r*.10,0,r*.06);c.stroke();
    c.restore();

  c.fillStyle='#fff1d4';c.beginPath();c.arc(-r*.07,-r*.1,r*.09,0,TAU);c.fill();

function flowerBloom(x,y,r,tone,phase,t){
  const opening=smooth(1.2+phase*.32,3.5+phase*.36,t);
  if(opening<=.002)return;
  const spr=flowerSprite(r,tone);
  g.save();g.globalAlpha*=opening;g.translate(x,y);
  g.rotate(Math.sin(t*.34+phase)*.025);
  g.drawImage(spr,-spr.width/2,-spr.height/2);
  g.restore();

function garden(t){
  const fade=smooth(.35,2.5,t);
  if(fade<=.002)return;
  g.save();g.globalAlpha=fade;
  const stems=[
    [89,552,740,0,'#eca7b4',20],[161,470,754,1,'#ebc895',15],
    [100,663,803,2,'#e4b6db',17],[177,625,808,3,'#b8c5e8',21],
    [629,552,760,4,'#f2c18b',19],[551,462,762,5,'#c5b9e9',16],
    [633,670,813,6,'#e6b3cc',18],[538,643,807,7,'#e9d18c',22],
    [60,690,828,8,'#f0ddab',12],[670,702,835,9,'#e2a8be',13],

    const side=j===0?1:-1;
    const base=j===0?42:678;

  if(t<4.6)return;
