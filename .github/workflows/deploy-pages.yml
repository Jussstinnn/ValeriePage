name: Publicar Valerie en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Los scripts de compilación y las 35 pruebas usan Node.js nativo.
      # No se necesita npm install ni Playwright para el despliegue.
      - name: Construir el sitio estático
        run: npm run build

      - name: Comprobar proyecto (35 pruebas)
        run: npm test

      - name: Desactivar Jekyll
        run: touch dist/.nojekyll

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar sitio de dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
